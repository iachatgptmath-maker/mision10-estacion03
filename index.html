<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misión 10 IA · Estación 3 · Laboratorio de enigmas</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f5f9ff;background:#061a25}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% 0%,#164d5c 0%,transparent 45%),linear-gradient(140deg,#061a25,#082c34)}main{max-width:760px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;color:#afffeb;font-weight:800}.pill{background:#103c48;border:1px solid #2b8390;padding:9px 14px;border-radius:99px}h1{font-size:clamp(2rem,7vw,3.5rem);line-height:1.03;margin:24px 0 8px;color:#b7ff6c;text-shadow:0 3px 25px #407b3d}p{line-height:1.55}.sub{color:#b2d8dd}.card{background:#0e3340;border:1px solid #2e7281;box-shadow:0 15px 45px #0005;border-radius:24px;padding:clamp(18px,4vw,32px);margin-top:24px}.btn{border:0;border-radius:15px;padding:14px 18px;font-size:1rem;font-weight:850;cursor:pointer;background:#b7ff6c;color:#123224;min-height:48px}.btn.secondary{background:#1c5965;color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.options{display:grid;gap:12px;margin:20px 0}.option{border:2px solid #3c7b86;background:#143f4b;border-radius:14px;color:white;text-align:left;padding:16px;cursor:pointer;font-size:1rem}.option.selected{border-color:#b7ff6c;background:#265a4b}.option:disabled{cursor:default}label{display:block;font-weight:700;margin:16px 0 8px}input{width:100%;border:2px solid #4d8992;background:#061e29;color:white;border-radius:12px;padding:15px;font-size:1.2rem;text-transform:uppercase}.progress{height:9px;border-radius:99px;background:#214c56;overflow:hidden}.bar{height:100%;background:#b7ff6c;transition:width .25s}.puzzle{background:#092733;border-radius:16px;border:1px dashed #59919b;padding:22px;margin-top:20px;text-align:center;font-size:clamp(1.15rem,4vw,1.7rem);font-weight:800;letter-spacing:.02em}.feedback{padding:14px;background:#1b4b55;border-radius:12px;margin:15px 0}.score{font-size:3rem;color:#b7ff6c;font-weight:900;text-align:center}.status{padding:14px;background:#133c49;border-radius:12px;margin-top:14px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}footer{color:#9bc2c9;text-align:center;font-size:.83rem;margin:24px 0}small{color:#b9d6d9}
</style></head><body><main><div class="top"><span class="pill">⚗️ MISIÓN 03</span><span id="scoreTop">🏆 0 PTS</span></div><h1>LABORATORIO DE ENIGMAS</h1><p class="sub">Cinco experimentos mentales: lógica, matemáticas y ciencia. Piensen antes de responder.</p><section class="card" id="app" aria-live="polite"></section><footer>Misión 10 IA · Estación 3 · Un intento se registra al completar los cinco retos.</footer></main><script>
// Dirección de la implementación EXISTENTE de Apps Script. Mantener la misma URL /exec.
const ENDPOINT='https://script.google.com/a/macros/iedigital.edu.co/s/AKfycbyrz9NVJT-lpTcXlXuVYs06Mu8JpsyChqn8I6Hn9VjhsQ9nnM9zUJrZ4cArkg-guu8/exec';
const qs=[
{title:'El puente de los robots',prompt:'Un robot cruza 12 metros en 3 segundos a velocidad constante. ¿Cuánto recorrerá en 8 segundos?',visual:'12 m ÷ 3 s = ? m/s<br>Después: 8 s × velocidad',options:['24 metros','32 metros','36 metros','48 metros'],answer:1,explain:'12 ÷ 3 = 4 m/s; en 8 segundos recorre 4 × 8 = 32 metros.'},
{title:'La balanza misteriosa',prompt:'Dos esferas idénticas y una pesa de 4 kg equilibran una pesa de 14 kg. ¿Cuánto pesa cada esfera?',visual:'⚪ + ⚪ + 4 kg = 14 kg',options:['4 kg','5 kg','6 kg','9 kg'],answer:1,explain:'Las dos esferas suman 10 kg, así que cada una pesa 5 kg.'},
{title:'El frasco que se enfría',prompt:'Un termómetro marca 18 °C. La temperatura baja 5 °C cada 10 minutos. ¿Qué marcará después de 30 minutos?',visual:'18 °C → 10 min → 20 min → 30 min',options:['3 °C','8 °C','−3 °C','13 °C'],answer:0,explain:'En 30 minutos baja 3 × 5 = 15 °C; 18 − 15 = 3 °C.'},
{title:'La secuencia del laboratorio',prompt:'Encuentra el siguiente número de esta secuencia. Observa cómo aumenta cada salto.',visual:'3 → 6 → 11 → 18 → 27 → ?',options:['34','36','38','40'],answer:2,explain:'Los incrementos son 3, 5, 7, 9; sigue 11. Entonces 27 + 11 = 38.'},
{title:'El experimento de las lámparas',prompt:'En un circuito en serie con dos bombillas iguales, si una se funde y abre el circuito, ¿qué sucede con la otra?',visual:'🔋 ─ 💡 ─ 💡 ─ 🔋<br><small>Circuito en serie</small>',options:['Brilla más','Sigue igual','Se apaga','Parpadea'],answer:2,explain:'Al abrirse el circuito deja de circular corriente por ambas bombillas.'}
];
const app=document.getElementById('app'),scoreTop=document.getElementById('scoreTop');let index=-1,team='',answers=[],chosen=null,confirmed=false,sent=false,attemptId='';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const score=()=>answers.reduce((n,a,i)=>n+(a===qs[i].answer?20:0),0);
function uuid(){if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();return 'm10-'+Date.now()+'-'+Math.random().toString(36).slice(2,14)}
function render(){scoreTop.textContent='🏆 '+score()+' PTS';if(index===-1){app.innerHTML=`<h2>🚀 ¿Equipo listo?</h2><p>Introduce tu código para iniciar los cinco retos.</p><label for="team">Código del equipo</label><input id="team" placeholder="M10-001" maxlength="7" value="${esc(team)}"><div class="actions"><button class="btn" id="start">COMENZAR MISIÓN</button></div><p><small>Equipos autorizados: M10-001 a M10-020.</small></p>`;document.getElementById('start').onclick=()=>{let t=document.getElementById('team').value.trim().toUpperCase();if(!/^M10-0(0[1-9]|1[0-9]|20)$/.test(t)){alert('Ingresa un código válido, por ejemplo M10-001');return}team=t;index=0;answers=[];attemptId=uuid();sent=false;render()};return}
if(index===qs.length){app.innerHTML=`<h2>🏁 ¡MISIÓN COMPLETADA!</h2><div class="score">${score()} / 100</div><p style="text-align:center">Equipo <strong>${esc(team)}</strong> · ${score()/20} respuestas correctas</p><div class="status" id="sendStatus">Preparando el registro del intento…</div><div class="actions"><button class="btn secondary" id="again">VOLVER A JUGAR</button><button class="btn" id="retry" hidden>REENVIAR RESULTADO</button></div>`;document.getElementById('again').onclick=()=>{index=-1;team='';answers=[];chosen=null;confirmed=false;render()};document.getElementById('retry').onclick=send; if(!sent)send();return}
const q=qs[index];app.innerHTML=`<div class="progress"><div class="bar" style="width:${index/qs.length*100}%"></div></div><p><strong>RETO ${index+1} DE ${qs.length}</strong></p><h2>${esc(q.title)}</h2><p>${esc(q.prompt)}</p><div class="puzzle">${q.visual}</div><div class="options">${q.options.map((o,i)=>`<button class="option ${chosen===i?'selected':''}" data-i="${i}" ${confirmed?'disabled':''}>${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}</div><div id="result"></div><button class="btn" id="confirm" ${chosen===null?'disabled':''}>${confirmed?(index===4?'FINALIZAR MISIÓN':'SIGUIENTE RETO'):'CONFIRMAR RESPUESTA'}</button>`;
document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(confirmed)return;chosen=Number(b.dataset.i);render()});document.getElementById('confirm').onclick=()=>{if(!confirmed){if(chosen===null)return;confirmed=true;answers[index]=chosen;const good=chosen===q.answer;render();document.getElementById('result').innerHTML=`<div class="feedback"><strong>${good?'✅ ¡Correcto! +20 puntos':'❌ Respuesta incorrecta'}</strong><p>${esc(q.explain)}</p></div>`}else{index++;chosen=null;confirmed=false;render()}}}
function send(){sent=true;const status=document.getElementById('sendStatus'),retry=document.getElementById('retry');if(!status)return;status.textContent='Enviando resultado…';retry.hidden=true;const payload=new URLSearchParams({equipo:team,estacion:'03',puntos:String(score()),id:attemptId});
// Apps Script puede bloquear lectura CORS; no-cors permite enviar pero no confirmar la escritura.
fetch(ENDPOINT,{method:'POST',mode:'no-cors',body:payload}).then(()=>{status.textContent='📤 Resultado enviado. Confirma su recepción en Google Sheets (pestaña Intentos).';}).catch(()=>{status.textContent='⚠️ No se pudo enviar. Comprueba internet y vuelve a intentarlo.';retry.hidden=false;sent=false})}
render();
</script></body></html>
